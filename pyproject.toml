[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-grant-data"
version = "0.1.0"
description = "Find non-equity project funding and its reporting obligations."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-grant-data = "book_grant_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_grant_data = ["*.json"]
